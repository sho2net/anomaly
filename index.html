<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ANOMALY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17222C; --bg2:#1F2E3A; --panel:#243441; --panel2:#2E4150; --line:#3B5061;
  --text:#EEF3F6; --muted:#93A6B4; --ink:#12191F;
  --flare:#E5533D; --tide:#3D8FE5; --grow:#4CAF6A; --ray:#E8C45C; --void:#9B8CCB;
  --anom1:#FF6BD6; --anom2:#8B5CFF; --anom3:#4DD9FF;
  --font:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  --disp:"Zen Dots","Zen Kaku Gothic New",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ --bg:#17222C; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;touch-action:manipulation}
button{font-family:var(--font);font-size:14px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;color:var(--text);background:var(--panel2)}
button.primary{background:var(--text);color:var(--ink);font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--anom3);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;position:relative;display:flex;flex-direction:column}
.screen{display:none;height:100%;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
h1.logo{font-family:var(--disp);font-size:44px;letter-spacing:.06em;margin:0;line-height:1;
  background:linear-gradient(120deg,var(--anom1),var(--anom2) 50%,var(--anom3));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px}
.disp{font-family:var(--disp)}
.row{display:flex;gap:8px;align-items:center}
.wrap{padding:16px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
.topbar .t{font-weight:700;flex:1}
.seg{display:flex;background:var(--panel);border-radius:10px;padding:3px;gap:3px}
.seg button{padding:8px 12px;border-radius:8px;background:transparent;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text)}
#segA button{flex:1;padding:8px 4px;line-height:1.2}
#segA button.on{box-shadow:inset 0 -3px 0 var(--ac);color:var(--text)}
.field-label{font-size:12px;color:var(--muted);margin:14px 0 6px}
input[type=text]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font-family:var(--font);width:100%}

/* ---------- cards ---------- */
.card{position:relative;width:74px;height:104px;border-radius:8px;background:var(--panel2);border:2px solid var(--ac,#6A8092);overflow:hidden;flex:0 0 auto;user-select:none;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.card{--icobg:var(--panel2)}
.card .art{position:absolute;left:0;right:0;top:46px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ac);pointer-events:none}
.card .art svg{width:38px;height:38px;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.card .cost{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--ac);color:#fff;font-family:var(--disp);font-size:13px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card .power{position:absolute;right:4px;bottom:3px;font-family:var(--disp);font-size:16px;color:#fff;text-shadow:0 1px 2px #000}
.card .power.dmg{color:#FF7B7B}
.card .atk{position:absolute;left:4px;bottom:3px;font-family:var(--disp);font-size:16px;color:#FFD86B;text-shadow:0 1px 2px #000}
.bigcard .atk{font-size:28px;left:12px;bottom:6px}
.card .name{position:absolute;left:4px;right:4px;top:29px;font-size:10.5px;font-weight:700;line-height:1.2;text-shadow:0 1px 2px #000}
.card .type{position:absolute;left:4px;bottom:5px;font-size:9px;color:var(--muted)}
.card .type:empty{display:none}
.card .rar{position:absolute;right:4px;top:5px;font-size:9px;color:var(--ac);font-family:var(--disp)}
.card.a-none{--ac:#9AA7B2}
.card.a-flare{--ac:var(--flare)} .card.a-tide{--ac:var(--tide)} .card.a-grow{--ac:var(--grow)} .card.a-ray{--ac:var(--ray)} .card.a-void{--ac:var(--void)}
.card.a-ray .cost{color:#3a2a00;text-shadow:none}
.card.treasure{--ac:#FFD86B;border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,#FFE9A3,#E0A62E,#FFE9A3) border-box;box-shadow:0 0 10px rgba(255,216,107,.35)}
.card.treasure .cost{background:linear-gradient(135deg,#FFE9A3,#E0A62E);color:#3a2a00;text-shadow:none}
.card.anom{--ac:#C58CFF;border-color:transparent;background:linear-gradient(var(--panel2),var(--panel2)) padding-box,linear-gradient(135deg,var(--anom1),var(--anom2),var(--anom3)) border-box}
.card.anom .cost{background:linear-gradient(135deg,var(--anom1),var(--anom2))}
.card.anom .art{color:#D9A6FF}
.card.back{background:repeating-linear-gradient(45deg,#2a3a48 0 6px,#213040 6px 12px);border-color:#4a5f70}
.card.back .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:22px;color:#6f8797}
.card.tapped{transform:rotate(90deg) scale(.86)}
.card.sick{opacity:.75}
.card.ready{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 2px 8px rgba(0,0,0,.4)}
.card.target{box-shadow:0 0 0 3px var(--anom3),0 0 14px var(--anom3)}
.card.sel{box-shadow:0 0 0 3px #fff}
.card .badge{position:absolute;left:3px;bottom:20px;font-size:9px;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:4px}
.card .eq{position:absolute;right:3px;top:22px;font-size:9px;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:4px}
.card.frozen::after{content:"凍";position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#bfe9ff;opacity:.7;pointer-events:none}
/* big card */
.bigcard{width:240px;height:370px;border-radius:14px;border-width:3px;margin:0 auto}
.bigcard .cost{width:38px;height:38px;font-size:20px;left:8px;top:8px}
.bigcard .rar{top:12px;right:10px;font-size:12px}
.bigcard .name{top:54px;left:10px;right:10px;font-size:16px}
.bigcard .art{top:92px;height:70px}
.bigcard .art svg{width:64px;height:64px}
.bigcard .type{top:80px;bottom:auto;left:10px;font-size:11px}
.bigcard .text{position:absolute;left:10px;right:10px;top:168px;bottom:44px;font-size:12.5px;line-height:1.5;background:rgba(0,0,0,.35);border-radius:8px;padding:8px;overflow-y:auto}
.bigcard .power{font-size:28px;right:12px;bottom:6px}
.bigcard .flav{position:absolute;left:12px;bottom:12px;font-size:10px;color:var(--muted)}

/* ---------- battle ---------- */
#battle{background:radial-gradient(120% 70% at 50% 0%,#233544 0%,var(--bg) 60%)}
.pbar{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:12px;color:var(--muted)}
.pbar .life{font-family:var(--disp);font-size:22px;color:var(--text);min-width:52px;padding:4px 8px;border-radius:10px;background:var(--panel);text-align:center;cursor:pointer;border:2px solid transparent}
.pbar .life.target{border-color:var(--anom3);box-shadow:0 0 12px var(--anom3)}
.pbar .life.hit{animation:hit .4s}
@keyframes hit{0%{background:#7a2a2a}100%{background:var(--panel)}}
.pbar .st{display:flex;flex-direction:column;line-height:1.2}
.pbar .st b{color:var(--text);font-family:var(--disp);font-size:13px;font-weight:400}
.pbar .nm{flex:1;color:var(--text);font-weight:700}
.energyrow{display:flex;gap:3px;flex-wrap:wrap;max-width:190px;justify-content:flex-end}
.chip{width:10px;height:15px;border-radius:3px;background:var(--anom3);opacity:.95}
.chip.tapped{opacity:.25}
.field{display:flex;gap:6px;padding:8px 10px;min-height:120px;align-items:center;overflow-x:auto;justify-content:flex-start}
.field>.card:first-child{margin-left:auto}.field>.card:last-child{margin-right:auto}
.field.empty::before{content:attr(data-empty);color:var(--muted);font-size:12px}
.mid{display:flex;align-items:center;gap:8px;padding:4px 12px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:12px;min-height:34px}
.mid .logline{flex:1;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mid .phase{font-family:var(--disp);font-size:11px;padding:3px 8px;border-radius:6px;background:var(--panel2)}
.mid .phase.you{background:var(--text);color:var(--ink)}
.hand{display:flex;gap:6px;padding:8px 10px 6px;overflow-x:auto;min-height:118px;align-items:flex-end}
.hand.fan{display:block;position:relative;height:136px;min-height:0;overflow:visible;padding:0;margin-top:4px}
.hand.fan .card{position:absolute;transform-origin:50% 130%;transition:transform .15s,bottom .15s}
.hand.fan .card:active{transform:translateY(-14px) scale(1.06)!important;z-index:50!important}
.hand .card.dim{opacity:.5}
.actions{display:flex;gap:8px;padding:6px 10px 10px;align-items:center}
.actions .hint{flex:1;font-size:12px;color:var(--muted)}
.overlay{position:absolute;inset:0;background:rgba(10,16,22,.78);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay.center{align-items:center}
.sheet{background:var(--bg2);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:92%;overflow-y:auto}
.overlay.center .sheet{border-radius:18px}
.sheet h3{margin:0 0 10px;font-size:15px}
.gloss{margin:10px auto 0;max-width:420px;font-size:12px;line-height:1.6;color:var(--muted);background:var(--panel);border-radius:10px;padding:8px 10px}
.gloss div+div{margin-top:4px}
.gloss b{color:var(--text)}
.reveal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(139,92,255,.35),rgba(8,10,16,.88) 65%);animation:rvbg .35s ease-out}
.reveal.legend{background:radial-gradient(circle at 50% 45%,rgba(255,196,80,.3),rgba(120,40,110,.55) 40%,rgba(8,10,16,.95) 70%)}
.reveal.out{animation:rvout .3s forwards}
.rv-inner{display:flex;flex-direction:column;align-items:center;gap:8px}
.rv-kind{font-family:var(--disp);font-size:22px;letter-spacing:.12em;background:linear-gradient(120deg,var(--anom1),var(--anom2),var(--anom3));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rvkind .6s ease-out}
.reveal.legend .rv-kind{font-size:26px;background:linear-gradient(120deg,#FFD86B,#FF6BD6,#FFD86B);-webkit-background-clip:text;background-clip:text}
.rv-who{font-size:12px;color:var(--muted)}
.rv-card{animation:rvcard .7s cubic-bezier(.2,1.4,.4,1)}
.reveal.legend .rv-card .card{box-shadow:0 0 40px rgba(255,216,107,.7),0 0 90px rgba(255,107,214,.4)}
.rv-tap{font-size:11px;color:var(--muted);margin-top:4px}
@keyframes rvbg{from{opacity:0}to{opacity:1}}
@keyframes rvout{to{opacity:0}}
@keyframes rvcard{0%{transform:scale(.3) rotateY(90deg);opacity:0}100%{transform:scale(1) rotateY(0);opacity:1}}
@keyframes rvkind{0%{transform:translateY(-12px);opacity:0;letter-spacing:.5em}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.reveal,.rv-card,.rv-kind{animation:none}}
.card.mullx{outline:3px solid #f28f8f;outline-offset:-3px}
.card.mullx::before{content:'戻す';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:rgba(160,40,40,.55);z-index:3;font-size:13px}
.bosscard{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px;border-left:4px solid var(--ac)}
.bosscard .bn{font-weight:700;margin-bottom:4px}
.bosscard .clr{font-size:11px;color:#7be0b0;margin-left:6px}
.bosscard button{margin-top:8px;width:100%}
.bosscard.locked{opacity:.45}
.advcolors{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.advcolors button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-bottom:3px solid var(--ac)}
.advcolors .ico svg,.advnodes .ico svg{width:30px;height:30px;color:var(--ac,#C58CFF)}
.advcolors small{font-size:9px;color:var(--muted)}
.advhead{padding:10px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 30%,transparent),transparent);border-bottom:1px solid var(--line)}
.advhead .an{font-weight:700;font-size:15px}
.advhead .st{font-size:13px;color:#f28f8f;margin-top:2px}
.advhead .st .lost{color:var(--muted)}
.advhead .buff{font-size:11px;color:var(--muted);margin-top:2px}
.advprog{display:flex;align-items:center;gap:6px;justify-content:center;margin:6px 0 4px}
.advprog span{padding:4px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--ac);color:var(--muted);font-size:13px}
.advprog span.now{background:var(--ac);color:#fff;font-weight:700}
.advprog span.done{opacity:.4;text-decoration:line-through}
.advprog i{color:var(--muted);font-style:normal}
.advnodes{display:flex;flex-direction:column;gap:8px}
.advnodes button{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;padding:12px;background:var(--panel);align-items:center}
.advnodes .ico{grid-row:span 2;display:flex;align-items:center;justify-content:center}
.advnodes .ico svg{color:var(--anom3)}
.advnodes small{color:var(--muted);font-size:11px}
.advfoe{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border-radius:12px;padding:12px;border-left:4px solid var(--ac);margin:8px 0 14px}
.advfoe .ico svg{width:52px;height:52px;color:var(--ac)}
.advfoe .fn{font-weight:700;font-size:17px}
.ante{display:flex;align-items:center;justify-content:center;gap:14px}
.ante .vs{font-size:24px;color:var(--muted)}
.advscene{display:flex;gap:12px;align-items:center;background:var(--panel);border-radius:12px;padding:12px;margin:8px 0 12px;text-align:left}
.advscene .ico svg{width:44px;height:44px;color:var(--anom3)}
.advscene.big{flex-direction:column;text-align:center;padding:22px 14px}
.advscene.big .ico svg{width:110px;height:110px;color:#C58CFF;filter:drop-shadow(0 0 18px rgba(197,140,255,.5))}
.advscene .et{font-weight:700;font-size:18px}
.evmsg{margin:10px 0;font-size:15px}
.pcard .price{position:absolute;left:0;right:0;bottom:-8px;text-align:center;font-size:11px;font-family:var(--disp);color:#FFD86B;text-shadow:0 1px 2px #000}
.zone{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px;justify-content:flex-end}
.zone:empty{display:none}
.zchip{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:8px;font-size:11px;background:var(--panel);border:1px solid var(--line)}
.zchip svg{width:16px;height:16px;color:#C58CFF}
.zchip b{margin-left:4px;font-family:var(--disp);color:#FFD86B}
.zchip.trap{border-style:dashed;color:#f2b38f}
.helpbtn{padding:4px 10px;font-family:var(--disp);font-size:13px;border-radius:8px}
.overlay.center .sheet{max-height:94%}
.sheet .btns{display:flex;gap:8px;margin-top:14px}
.sheet .btns button{flex:1}
.picks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.log{font-size:12px;color:var(--muted);max-height:50vh;overflow-y:auto;line-height:1.6}
.log .turn{color:var(--text);font-weight:700;margin-top:6px}
.log .life{color:#f28f8f}.log .win{color:var(--anom3);font-weight:700}
.toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:10px 18px;border-radius:12px;font-family:var(--disp);font-size:20px;z-index:30;pointer-events:none;animation:toast 1.1s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

/* ---------- draft / codex ---------- */
.grid{display:flex;flex-wrap:wrap;gap:8px;padding:10px;justify-content:center}
.pcard{position:relative}
.pcard .cnt{position:absolute;left:-4px;bottom:-6px;background:var(--text);color:var(--ink);font-family:var(--disp);font-size:11px;border-radius:8px;padding:1px 6px;z-index:2}
.pcard .have{position:absolute;right:-4px;top:-6px;background:var(--panel2);border:1px solid var(--line);font-size:10px;border-radius:8px;padding:1px 5px;z-index:2;color:var(--muted)}
.pcard.out .card{opacity:.35}
.filters{display:flex;gap:6px;padding:8px 10px;overflow-x:auto}
.mainpick{display:flex;gap:4px;padding:8px 10px 0;align-items:center}
.mainpick .sub{font-size:11px;margin-right:4px}
.mainpick button{flex:1;padding:6px 2px;font-size:13px;line-height:1.1;background:var(--panel);border-bottom:3px solid transparent}
.mainpick button small{display:block;font-size:9px;color:var(--muted)}
.mainpick button.on{background:var(--panel2);border-bottom-color:var(--ac);color:var(--text)}
.filters button{padding:6px 10px;font-size:12px;border-radius:8px;white-space:nowrap}
.filters button.on{background:var(--text);color:var(--ink)}
.deckbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);background:var(--bg2)}
.deckbar .n{font-family:var(--disp);font-size:20px}
.deckbar .n.ok{color:#7be0b0}
.curve{display:flex;gap:2px;align-items:flex-end;height:26px}
.curve i{display:block;width:9px;background:var(--muted);border-radius:2px 2px 0 0;position:relative}
.curve i::after{content:attr(data-c);position:absolute;top:100%;left:0;right:0;text-align:center;font-size:8px;color:var(--muted)}
.attrs{display:flex;gap:4px;font-size:11px}
.attrs span{padding:1px 5px;border-radius:4px;background:var(--panel)}
.kwlist{padding:6px 14px;font-size:12px;color:var(--muted)}
.kwlist b{color:var(--text)}
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;flex:1;padding:20px;text-align:center}
.result .big{font-family:var(--disp);font-size:34px}
.result .score{font-family:var(--disp);font-size:26px;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.menu button{padding:14px}
@media (prefers-reduced-motion:reduce){ .card{transition:none} .toast{animation:none;opacity:1} }
@media (min-width:600px){ #app{max-width:560px;border-left:1px solid var(--line);border-right:1px solid var(--line)} }

/* ---- v3.4 モバイル対応 ---- */
html,body{height:100%;height:100dvh}
#app{height:100%;height:100dvh}
.pbar{flex-wrap:nowrap;min-width:0;gap:6px;padding:4px 8px}
.pbar .nm{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:13px}
.pbar .nm div{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pbar .st{flex:0 0 auto;white-space:nowrap;font-size:11px}
.pbar .life{flex:0 0 auto;min-width:44px;font-size:20px;padding:3px 6px}
.energyrow{flex:0 1 auto;max-width:64px;gap:2px}
.chip{width:6px;height:11px;border-radius:2px}
#battle{overflow-y:auto;overflow-x:hidden}
#battle .actions{position:sticky;bottom:0;z-index:5;background:linear-gradient(transparent,var(--bg) 30%);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#battle .actions .hint{min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#battle .actions button{flex:0 0 auto;white-space:nowrap}
.zone{flex-wrap:nowrap;overflow-x:auto;padding:0 8px 2px;justify-content:flex-start}
.zchip{flex:0 0 auto;white-space:nowrap;max-width:130px}
.zchip span{overflow:hidden;text-overflow:ellipsis}
.mid .logline{min-width:0}
@media (max-width:400px){

// ---- スタッツ自動算出（明示 st があれば優先）----
// v2.3: ハースストーン寄りの配分。合計＝コスト×2＋1（R+1/L+2）、効果税は1つ1.5（条件付き・破壊時は0.5）、攻撃比率は0.5前後
(function(){
  const KWC={haste:1,unblockable:2,breakthrough:1,blocker:1,armor:2,drain:1,double:3,deathtouch:2};
  const RATIO={flare:0.52,tide:0.52,grow:0.5,ray:0.5,void:0.52};
  CARDS.forEach(d=>{
    if(d.type!=='creature') return;
    if(d.st){ d.power=d.st[0]; d.hp=d.st[1]; return; }
    let total=2*d.cost+1+({R:1,L:2}[d.rarity]||0)+(d.dev||0);
    d.kw.forEach(k=>total-=KWC[k]||0);
    d.effects.forEach(x=>{ if(x.e==='lifecost'||x.e==='selfDestroy'){ total+=2; return; } if(x.req||x.t==='death') total-=0.5; else total-=1.5; });
    if(d.attr[0]==='tide' && d.sb) total+=1;
    if(d.attr[0]==='flare') total-=1;
    if(!d.effects.length && !d.kw.length) total+=1;
    if(d.costFn) total=2*d.cost+1;
    total=Math.max(2,Math.round(total));
    let r=d.attr.length?RATIO[d.attr[0]]:0.5; if(d.kw.includes('blocker')) r=0.3;
    let a=Math.max(1,Math.min(total-1,Math.round(total*r-0.01))); let h=total-a;
    if(d.attr[0]==='grow' && d.cost>=5 && !d.effects.length) h+=1;
    if(d.attr[0]==='ray' && !d.kw.includes('blocker')) h+=1;
    d.power=a; d.hp=h;
  });
})();

  if(d.type==='trap') lines.push('罠：伏せて置く（各自2つまで）。相手には中身が見えない。条件を満たすと一度だけ発動して墓地へ。');
  if(d.sb==='cost') lines.push('詠唱：手札にある間、自分がスペルを唱えるたびコスト-1。');
  if(d.sb==='grow'||d.sb==='flag') lines.push('詠唱：手札にある間、自分がスペルを唱えるたび詠唱+1。');
  if(d.costFn==='allies') lines.push('自分の場のクリーチャー1体につきコスト-1。');
  if(d.costFn==='oppHand') lines.push('コストは相手の手札の枚数に等しい。');
  if(d.dyn==='hand') lines.push('攻撃力と体力は自分の手札の枚数に等しい。');
  if(d.kw && d.kw.length) lines.push(d.kw.map(k=>KW[k]).join('、'));
  if(d.type==='equip'){
    const parts=['装備したクリーチャーは+'+d.equip.power+'/+'+d.equip.power];
    if(d.equip.kw.length) parts.push(d.equip.kw.map(k=>KW[k]).join('、')+'を得る');
    lines.push(parts.join('、')+'。');
  }
  // group effects by trigger keeping order
  const seen={}; const order=[];
  d.effects.forEach(x=>{ if(!seen[x.t]){seen[x.t]=[];order.push(x.t);} seen[x.t].push(effectText(Object.assign({_cr:d.type==='creature', _relic:d.type==='relic'},x.per?{attrRef:d.attr[0]}:{},x)).replace(/^相手のクリーチャー1体(に|を)/, d.type==='trap'?'そのクリーチャー$1':'相手のクリーチャー1体$1')); });
  order.forEach(t=>lines.push((d.type==='relic'?TRIG[t].replace('自分の他のクリーチャー','自分のクリーチャー').replace('このカード以外の',''):TRIG[t])+seen[t].join('')));
  return lines;
}

// main: attribute key. 87 cards = main attribute ~55 + neutral ~32
function drawPool(rng, n, main){
  const pick=(pred)=>{ const byR={C:[],U:[],R:[],L:[]}; CARDS.filter(pred).forEach(c=>byR[c.rarity].push(c)); const r=rng()*100; let k= r<60?'C': r<88?'U': r<98?'R':'L'; if(!byR[k].length) k='C'; return rng.pick(byR[k]); };
  const out=[];
  const three=rng.shuffle(ATTR_ORDER).slice(0,3);
  for(let i=0;i<n;i++){
    if(!main){ const r=rng(); out.push(r<0.86 ? pick(c=>c.attr.length===1 && c.attr[0]===three[Math.floor((r/0.86)*3)]) : pick(c=>c.attr.length===0)); continue; }
    const isMain = rng()<0.63;
    out.push(isMain ? pick(c=>c.attr.includes(main)) : pick(c=>c.attr.length===0));
  }
  return out;
}

function makeAnomaly(rng, idx, main){
  if(idx%3===2) return makeWeird(rng, idx);
  if(idx%3===0 && rng()<0.5) return makeLegend(rng, idx);
  const attrs = main ? (rng()<0.8 ? [main] : [main, rng.pick(ATTR_ORDER.filter(a=>a!==main))]) : (rng()<0.8 ? [rng.pick(ATTR_ORDER)] : (()=>{ const s=rng.shuffle(ATTR_ORDER); return [s[0],s[1]]; })());
  const type = rng()<0.7 ? 'creature' : 'spell';
  const wild = type==='creature' ? ANOM_WILD_CREATURE : ANOM_WILD_SPELL;
  const normal = type==='creature' ? ANOM_CREATURE_PARTS : ANOM_SPELL_PARTS;
  // always 1 wild part (sometimes 2), plus 0-1 normal part
  const chosen=[]; let pts=0; const used={};
  const add=(p)=>{ const key=p.kw?('kw'+p.kw):(p.ef.t+p.ef.e); if(used[key]) return false; used[key]=1; chosen.push(p); pts+=p.pts; return true; };
  add(rng.pick(wild));
  if(rng()<0.3) add(rng.pick(wild));
  if(type==='creature' ? rng()<0.7 : rng()<0.4) add(rng.pick(normal));
  const minC = chosen.reduce((m,p)=>Math.max(m,p.min||0),0);
  const cost = Math.max(2, minC, Math.min(8, Math.ceil(pts/2)));
  const d = { id:'anom'+idx+'_'+Math.floor(rng()*1e9), name:anomalyName(rng,attrs,type), attr:attrs, type, cost, rarity:'A', anomaly:true, kw:[], effects:[], power:0, hp:0, pts, icon:'anom'+(1+rng.int(6)) };
  chosen.forEach(p=>{ if(p.kw) d.kw.push(p.kw); else d.effects.push(p.ef); });
  if(type==='creature'){
    // same stat rule as normal cards: effects and keywords cost stats. wild effects cost 3, normal 2, keywords per table
    const KWP={haste:1,unblockable:2,breakthrough:1,blocker:-1,armor:2,drain:1,double:3};
    let total=2*cost+1+(rng()<0.35?1:0);
    chosen.forEach(p=>{ if(p.kw) total-=KWP[p.kw]||0; else total-= (wild.includes(p)?3:2); });

    let r={flare:0.56,tide:0.52,grow:0.5,ray:0.45,void:0.52}[attrs[0]]; if(d.kw.includes('blocker')) r=0.4; d.power=Math.max(1,Math.round(total*r)); d.hp=Math.max(1,total-d.power); if(attrs[0]==='grow') d.hp++; if(attrs[0]==='tide') d.power++;
  }
  return d;
}

  mkCr(card, opts){ return Object.assign({c:card, tapped:false, sick:!card.d.kw.includes('haste'), pump:0, tmp:0, dmg:0, equips:[], armorUsed:false, frozen:false, silenced:false, fixed:null, doubled:false, stun:false, grants:[], mult:1, swapped:false}, opts||{}); }
  owner(cr){ return this.players.find(p=>p.field.includes(cr)); }
  findCr(uid){ for(const p of this.players){ const c=p.field.find(x=>x.c.uid===uid); if(c) return c; } return null; }

  // ---- draw / life ----
  draw(p, n, silent){
    for(let i=0;i<n;i++){
      if(p.deck.length===0){ this.loseLife(p,1,'山札切れ'); continue; }
      const c=p.deck.pop();
      if(c.d.onDraw){ this.say(p.name+'は「'+c.d.name+'」を引いた！（代わりにもう1枚引く）','life'); this.loseLife(p,c.d.onDraw.n,'「'+c.d.name+'」'); i--; continue; }
      p.hand.push(c);
      if(this.phase!=='mulligan') this.trigger(p,'draw',null);
    }
    if(!silent) this.say(p.name+'はカードを'+n+'枚引いた', 'draw');
  }
  loseLife(p, n, why){
    if(n<=0) return; p.life -= n; this.ev('life',{p:p.i,n:-n});
    if(p.bossRules && p.bossRules.phase && !p.phase2 && p.life>0 && p.life<=p.bossRules.phase){ p.phase2=true; p.life+=6; p.leaderOverride=AN.LEADER_EX[p.bossRules.phaseLeader||'devour']; p.abilityUsed=false; p.field.forEach(c=>c.pump+=1); this.ev('bossphase',{p:p.i}); this.say(p.name+'は真の姿を現した！（ライフ+6、リーダー能力「'+p.leaderOverride.name+'」、自分のクリーチャーすべてに+1/+1）','win'); }
    this.say(p.name+'のライフ -'+n+(why?'（'+why+'）':''), 'life');
    this.checkWin();
  }
  gainLife(p,n){ if(n<=0)return; p.life=Math.min(99,p.life+n); p.pray++; this.ev('life',{p:p.i,n}); this.say(p.name+'のライフ +'+n+'（祈り'+p.pray+'）', 'heal');
    this.trigger(p,'heal',null); }
  // fire a trigger for creatures on p's field (except 'except' creature card)
  trigger(p, t, exceptCard){ p.field.slice().forEach(c=>{ if(exceptCard && c.c===exceptCard) return; this.effs(c).forEach(x=>{ if(x.t===t) this.queue.push({type:'effect',p:p.i,src:c.c,eff:x}); }); }); p.relics.slice().forEach(r=>{ if(exceptCard && r.c===exceptCard) return; r.c.d.effects.forEach(x=>{ if(x.t===t) this.queue.push({type:'effect',p:p.i,src:r.c,eff:x}); }); }); }
  fireTraps(owner, kind, targetUid){ const fired=owner.traps.filter(c=>c.d.effects.some(x=>x.t===kind)); if(fired.length) this.queue.push({type:'trapPause'}); fired.forEach(c=>{ owner.traps.splice(owner.traps.indexOf(c),1); owner.grave.push(c); c.d.revealed=true; this.say(owner.name+'の罠「'+c.d.name+'」が発動した！','play'); this.ev('trap',{p:owner.i,d:c.d}); c.d.effects.forEach(x=>{ if(x.t===kind) this.queue.push({type:'effect',p:owner.i,src:c,eff:x,choice:targetUid===undefined?undefined:targetUid}); }); }); return fired; }
  reqOk(p, req, t, consume){
    if(!req) return true;
    if(req.combo!=null){ const c = t&&t.snap ? t.snap.combo : p.plays; if(c<req.combo) return false; }
    if(req.awaken && p.energyMax<7) return false;
    if(req.pray!=null && p.pray<req.pray) return false;
    if(req.allies!=null && p.field.length<req.allies) return false;
    if(req.boost!=null && !((t&&t.src&&t.src.boost||0)>=req.boost)) return false;
    if(req.souls!=null){ if(p.souls<req.souls) return false; if(consume){ p.souls-=req.souls; this.say(p.name+'は供物を'+req.souls+'消費した（残り'+p.souls+'）'); } }
    return true;
  }
  scaleCount(p, x, t){
    switch(x.scale){
      case 'combo': return t&&t.snap ? t.snap.combo : p.plays;
      case 'boost': return (t&&t.src&&t.src.boost)||0;
      case 'pray': return p.pray;
      case 'souls': return p.souls;
      case 'spells': return p.spellsCast;
      case 'hand': return p.hand.length;
      case 'hands': return p.hand.length+this.opp(p).hand.length;
      case 'fallen': return p.fallen||0;
      case 'allies': return p.field.filter(c=>!t||c.c!==t.src).length;
      case 'field': return p.field.length;
    }
    return 0;
  }
  checkWin(){
    if(this.winner!=null) return;
    const dead = this.players.filter(p=>p.life<=0);
    if(dead.length===2) this.winner = 1-this.active; // both dead: active loses
    else if(dead.length===1) this.winner = 1-dead[0].i;
    if(this.winner!=null){ this.say(this.players[this.winner].name+'の勝利！','win'); this.queue=[]; this.pending=null; }
  }

  // ---- turn ----
  beginTurn(firstTurn){
    this.turn++; const p=this.players[this.active]; this.phase='main'; p.abilityUsed=false;
    p.field.forEach(c=>{ if(c.frozen){ c.frozen=false; } else { c.tapped=false; c.stun=false; } c.sick=false; c.tmp=0; c.doubled=false; c.attacked=false; });
    p.energyMax=Math.min(ENERGY_MAX,p.energyMax+1); p.energy=p.energyMax; p.plays=0;
    // v3.14 ハードの最終ボス：数ターンごとに、相手の場で最も攻撃力の高いクリーチャーの写し身を自分の場に生み出す（乱数は使わない）
    if(p.bossRules && p.bossRules.mirror && (p.mirrorTick=(p.mirrorTick||0)+1)%p.bossRules.mirror===0){ const o2=this.opp(p);
      if(o2.field.length && p.field.length<FIELD_MAX){ const src=o2.field.slice().sort((x,y)=>(this.power(y)-this.power(x))||(this.health(y)-this.health(x)))[0]; const nc=this.mkCr(this.inst(src.c.d)); p.field.push(nc); this.say(p.name+'は「'+src.c.d.name+'」の写し身を生み出した','play'); this.ev('mirror',{p:p.i,uid:nc.c.uid}); } }
    if(p.bossRules && p.bossRules.devour && (p.devourTick=(p.devourTick||0)+1)%2===0){ const o2=this.opp(p); const cs=o2.grave.filter(c=>!c.d.token&&!c.d.special); if(cs.length && p.hand.length<HAND_MAX){ const c=cs[this.rng.int(cs.length)]; p.hand.push(this.inst(c.d)); this.say(p.name+'は倒れたものの記憶を喰らった','draw'); } }
    if(p.bossRules && p.bossRules.chaos){
      const keys=Object.keys(AN.LEADER_EX).filter(k=>!k.startsWith('boss_')&&k!=='judge');
      const pool=keys.map(k=>AN.LEADER_EX[k]).concat(AN.ATTR_ORDER.map(a=>AN.LEADER[a]));
      p.leaderOverride=pool[this.rng.int(pool.length)]; p.abilityUsed=false;
      this.say(p.name+'のリーダー能力が「'+p.leaderOverride.name+'」に変異した','play');
      const idx=p.hand.map((c,i)=>i).filter(i=>!p.hand[i].d.anomaly);
      if(idx.length){ const i=idx[this.rng.int(idx.length)]; const old=p.hand[i]; p.hand[i]=this.inst(AN.makeAnomaly(this.rng, 20000+this.uid*3+1, null)); this.say(p.name+'の手札の1枚が新たなアノマリーに変異した','draw'); }
    }
    if(p.bonusNext){ p.energy+=p.bonusNext; this.say(p.name+'のエナジー+'+p.bonusNext,'charge'); p.bonusNext=0; }
    this.say('― '+p.name+'のターン'+this.turn+' ―','turn'); this.ev('turn',{p:p.i});
    if(!(firstTurn)) this.draw(p,1);
    p.field.slice().forEach(c=>this.effs(c).forEach(x=>{ if(x.t==='turnstart') this.queue.push({type:'effect',p:p.i,src:c.c,eff:x}); }));
    const o=this.opp(p); o.field.slice().forEach(c=>this.effs(c).forEach(x=>{ if(x.t==='oppturnstart') this.queue.push({type:'effect',p:o.i,src:c.c,eff:x}); }));
    p.hand.slice().forEach(c=>c.d.effects.forEach(x=>{ if(x.t==='handturn') this.queue.push({type:'effect',p:p.i,src:c,eff:x}); }));
    p.relics.slice().forEach(r=>{ r.c.d.effects.forEach(x=>{ if(x.t==='turnstart') this.queue.push({type:'effect',p:p.i,src:r.c,eff:x}); }); if(r.cd!=null){ r.cd--; if(r.cd<=0){ p.relics.splice(p.relics.indexOf(r),1); p.grave.push(r.c); this.say('置物「'+r.c.d.name+'」のカウントダウンが0になり消えた'); r.c.d.effects.forEach(x=>{ if(x.t==='expire') this.queue.push({type:'effect',p:p.i,src:r.c,eff:x}); }); } } });
    this.run();
  }
  endTurn(){
    if(this.winner!=null) return false;
    const p=this.players[this.active];
    if(this.pending) return false;
    p.field.forEach(c=>this.effs(c).forEach(x=>{ if(x.t==='endturn') this.queue.push({type:'effect',p:p.i,src:c.c,eff:x}); }));
    p.relics.forEach(r=>r.c.d.effects.forEach(x=>{ if(x.t==='endturn') this.queue.push({type:'effect',p:p.i,src:r.c,eff:x}); }));
    this.queue.push({type:'endturn'});
    this.run(); return true;
  }
  doEndTurn(){
    const p=this.players[this.active];
    while(p.hand.length>HAND_MAX){ const c=p.hand.pop(); p.grave.push(c); this.say(p.name+'は手札上限で「'+c.d.name+'」を捨てた'); }
    p.field.forEach(c=>c.tmp=0); this.checkDeaths();
    if(p.extraTurn){ p.extraTurn=false; this.say('― '+p.name+'の追加ターン ―','turn'); } else this.active = 1-this.active;
    this.beginTurn(false);
  }

  // ---- cost ----
  costOf(p, d, card){ let c=Math.max(0,d.cost-((card&&card.cm)||0)-(d.sb==='cost'&&card?(card.boost||0):0)); if(d.type==='spell') this.opp(p).relics.forEach(r=>r.c.d.effects.forEach(x=>{ if(x.t==='static'&&x.e==='spellTax') c++; })); if(d.costFn==='allies') c=Math.max(0,c-p.field.length); if(d.costFn==='oppHand') c=this.opp(p).hand.length; if(d.type==='spell'){ this.opp(p).field.forEach(o=>this.effs(o).forEach(x=>{ if(x.t==='static'&&x.e==='spellTax') c++; })); } return c; }
  canAfford(p, d, card){ return this.costOf(p,d,card)<=p.energy; }
  canPlay(p, card){
    if(this.winner!=null||this.pending||this.players[this.active]!==p) return false;
    if(!p.hand.includes(card)) return false;
    const d=card.d;
    if(d.type==='creature' && p.field.length>=FIELD_MAX) return false;
    if(d.type==='equip' && p.field.length===0) return false;
    if(d.type==='relic' && p.relics.length>=3) return false;
    if(d.type==='trap' && (p.traps.length>=2 || p.traps.some(c=>c.d.id===d.id))) return false;
    if(d.type==='spell' && !this.spellHasUse(p,d)) return false;
    return this.canAfford(p,d,card);
  }
  spellHasUse(p,d){
    // a targeted-only spell with no candidate can't be cast
    const needs=d.effects.filter(x=>this.needsTarget(x));
    if(needs.length===0) return true;
    return needs.some(x=>this.candidates(p,x).length>0) || d.effects.some(x=>!this.needsTarget(x));
  }
  play(p, card){
    if(!this.canPlay(p,card)) return false;
    const d=card.d; const paid=this.costOf(p,d,card); p.energy-=paid;
    p.hand.splice(p.hand.indexOf(card),1);
    if(d.anomaly) d.revealed=true;
    const snap={combo:p.plays}; p.plays++;
    { const q=this.opp(p); if(q.bossRules && q.bossRules.devour && d.anomaly && q.hand.length<HAND_MAX){ q.hand.push(this.inst(d)); this.say(q.name+'は「'+d.name+'」を喰らい、写し取った','play'); } }
    if(d.type==='creature'){
      const cr=this.mkCr(card);
      p.field.push(cr); this.say(p.name+'は「'+d.name+'」を召喚（エナジー'+paid+'）','play'); this.ev('play',{p:p.i,uid:card.uid,d:card.d});
      this.fireTraps(this.opp(p),'enemySummon',card.uid);
      d.effects.forEach(x=>{ if(x.t==='etb') this.queue.push({type:'effect',p:p.i,src:card,eff:x,snap}); });
      this.trigger(p,'summon',card);
    } else if(d.type==='spell'){
      this.say(p.name+'は「'+d.name+'」を唱えた（エナジー'+paid+'）','play'); this.ev('play',{p:p.i,uid:card.uid,d:card.d});
      const countered=this.fireTraps(this.opp(p),'enemySpell').some(c=>c.d.effects.some(x=>x.e==='counter'));
      if(countered) this.say('「'+d.name+'」は打ち消された','destroy');
      else d.effects.forEach(x=>{ if(x.t==='cast') this.queue.push({type:'effect',p:p.i,src:card,eff:x,snap}); });
      this.queue.push({type:'toGrave',p:p.i,card});
      p.spellsCast++; this.boostHand(p,1); this.trigger(p,'spell',null);
    } else if(d.type==='relic'){
      p.relics.push({c:card, cd:d.countdown||null}); this.say(p.name+'は置物「'+d.name+'」を置いた（エナジー'+paid+'）','play'); this.ev('play',{p:p.i,uid:card.uid,d});
    } else if(d.type==='trap'){
      p.traps.push(card); this.say(p.name+'は罠を仕掛けた（エナジー'+paid+'）','play');
    } else if(d.type==='equip'){
      this.say(p.name+'は「'+d.name+'」を装備（エナジー'+paid+'）','play'); this.ev('play',{p:p.i,uid:card.uid,d:card.d});
      this.queue.push({type:'equip',p:p.i,card});
    }
    this.trigger(p,'play',card);
    this.run(); return true;
  }
  boostHand(p,n){ p.hand.forEach(c=>{ if(c.d.sb) c.boost=(c.boost||0)+n; }); 
  }
  // ---- leader ability ----
  leaderDef(p){ return p.leaderOverride || (p.main ? AN.LEADER[p.main] : null); }
  canUseAbility(p){
    const L=this.leaderDef(p); if(!L) return false;
    if(this.winner!=null||this.pending||this.players[this.active]!==p||p.abilityUsed) return false;
    if(p.energy<L.cost) return false;
    const efs=[].concat(L.ef);
    for(const x of efs){ if(this.needsTarget(x) && this.candidates(p,x).length===0) return false; }
    if([].concat(L.ef).some(x=>x.e==='token'||x.e==='tokens') && p.field.length>=FIELD_MAX) return false;
    return true;
  }
  useAbility(p){
    if(!this.canUseAbility(p)) return false;
    const L=this.leaderDef(p); p.energy-=L.cost; p.abilityUsed=true;
    const src={uid:-1, d:{name:'リーダー能力「'+L.name+'」', attr:[p.main], kw:[], effects:[]}};
    this.say(p.name+'はリーダー能力「'+L.name+'」を使った（エナジー'+L.cost+'）','play');
    [].concat(L.ef).forEach(x=>this.queue.push({type:'effect',p:p.i,src,eff:x}));
    p.plays++; if(p.main==='tide') this.boostHand(p,1);
    this.trigger(p,'ability',null);
    this.run(); return true;
  }
  // ---- attack ----
  canAttackWith(p, cr){
    if(this.winner!=null||this.pending||this.players[this.active]!==p) return false;
    if(!p.field.includes(cr)||cr.tapped) return false;
    if(this.hasKw(cr,'noattack')) return false;
    if(cr.attacked && !(this.hasKw(cr,'double') && !cr.doubled)) return false;
    if(cr.sick && !this.hasKw(cr,'haste')) return false;
    return true;
  }
  attackTargets(p, cr){
    const o=this.opp(p);
    const guards=o.field.filter(c=>!c.tapped && this.hasKw(c,'blocker'));
    if(guards.length && !this.hasKw(cr,'unblockable')) return guards.map(c=>c.c.uid);
    const t=['player']; o.field.forEach(c=>t.push(c.c.uid)); return t;
  }
  attack(p, cr, target){
    if(!this.canAttackWith(p,cr)) return false;
    if(!this.attackTargets(p,cr).includes(target)) return false;
    this.phase='attack';
    if(cr.attacked && this.hasKw(cr,'double')) cr.doubled=true;
    cr.attacked=true;
    const tgtName = target==='player' ? this.opp(p).name : '「'+this.findCr(target).c.d.name+'」';
    this.say(p.name+'の「'+cr.c.d.name+'」が'+tgtName+'に攻撃','attack'); this.ev('attack',{p:p.i,uid:cr.c.uid,target});
    this.attackCtx={attacker:cr, target, p:p.i, blocker:null};
    this.fireTraps(this.opp(p),'enemyAttack',cr.c.uid);
    this.effs(cr).forEach(x=>{ if(x.t==='atk') this.queue.push({type:'effect',p:p.i,src:cr.c,eff:x}); });
    this.queue.push({type:'block'}); this.queue.push({type:'combat'});
    this.run(); return true;
  }
  blockCandidates(){ return []; } // v1.2: 守護方式（挑発）。ブロック宣言は廃止
  resolveCombat(){
    const ctx=this.attackCtx; this.attackCtx=null; if(!ctx) return;
    const atk=ctx.attacker, p=this.players[ctx.p], def=this.opp(p);
    if(!p.field.includes(atk)) return; // attacker left
    let target = ctx.blocker; let retaliate=true;
    if(target){ target.tapped=true; this.say(def.name+'の「'+target.c.d.name+'」がブロック','block'); }
    else if(ctx.target!=='player'){ target=this.findCr(ctx.target); if(!target) return; retaliate=!target.stun; }
    if(!target){
      const dmg=this.power(atk);
      this.ev('hit',{p:def.i,uid:atk.c.uid});
      this.loseLife(def,dmg,'「'+atk.c.d.name+'」の攻撃');
      if(this.hasKw(atk,'drain')) this.gainLife(p,dmg);
      return;
    }
    const pa=this.power(atk), pb=this.power(target);
    if(target && this.hasKw(atk,'breakthrough')){
      // v2.5: 突破はクリーチャーへの攻撃すべてで有効。相手の残り体力（猛毒なら1）を超えた分が相手プレイヤーに通る。装甲で止められたら通らない
      const need = (this.hasKw(target,'armor')&&!target.armorUsed) ? Infinity : (this.hasKw(atk,'deathtouch') ? 1 : Math.max(0,this.health(target)));
      const over = pa - need;
      if(over>0){ this.loseLife(def, over, '突破'); if(this.hasKw(atk,'drain')) this.gainLife(p,over); }
    }
    this.battle(atk,target,0,retaliate);
  }
  battle(atk, target, bonus, retaliate){
    const pa=this.power(atk)+(bonus||0), pb=this.power(target);
    this.ev('battle',{a:atk.c.uid,b:target.c.uid});
    this.say('「'+atk.c.d.name+'」('+pa+') と「'+target.c.d.name+'」('+pb+') が戦闘'+(retaliate===false?'（気絶中のため反撃なし）':''),'battle');
    this.dealDamage(target, pa, false, atk);
    if(retaliate!==false) this.dealDamage(atk, pb, false, target);
    this.checkDeaths();
  }
  // damage a creature. armor absorbs the first damage/destroy event entirely
  dealDamage(cr, n, check, src){
    if(n<=0) return;
    if(this.hasKw(cr,'armor') && !cr.armorUsed){ cr.armorUsed=true; this.say('「'+cr.c.d.name+'」の装甲が'+n+'ダメージを防いだ'); this.ev('armor',{uid:cr.c.uid}); return; }
    cr.dmg+=n;
    if(this.health(cr)>0 && !(src && this.hasKw(src,'deathtouch'))){ const q=this.owner(cr); if(q) this.effs(cr).forEach(x=>{ if(x.t==='damaged') this.queue.push({type:'effect',p:q.i,src:cr.c,eff:x}); }); }
    if(src && this.hasKw(src,'deathtouch') && this.health(cr)>0){ cr.dmg=this.maxHealth(cr); this.say('「'+cr.c.d.name+'」に猛毒がまわった','battle'); } this.ev('dmg',{uid:cr.c.uid,n});
    this.say('「'+cr.c.d.name+'」に'+n+'ダメージ（体力 '+Math.max(0,this.health(cr))+'/'+this.maxHealth(cr)+'）','battle');
    if(check!==false) this.checkDeaths();
  }
  checkDeaths(){
    for(const p of this.players){ p.field.slice().forEach(cr=>{ if(p.field.includes(cr) && this.health(cr)<=0) this.kill(cr); }); }
  }
  kill(cr){
    const p=this.owner(cr); if(!p) return;
    p.fallen=(p.fallen||0)+1;
    p.field.splice(p.field.indexOf(cr),1);
    cr.equips.forEach(e=>p.grave.push(e)); if(!cr.c.d.token) p.grave.push(cr.c);
    p.souls++;
    this.say('「'+cr.c.d.name+'」は破壊された','destroy'); this.ev('destroy',{p:p.i,uid:cr.c.uid});
    this.trigger(p,'allyDeath',cr.c);
    this.trigger(this.opp(p),'enemyDeath',null);
    this.effs(cr).forEach(x=>{ if(x.t==='death') this.queue.push({type:'effect',p:p.i,src:cr.c,eff:x}); });
  }
  destroy(cr){
    const p=this.owner(cr); if(!p) return;
    if(this.hasKw(cr,'armor') && !cr.armorUsed){ cr.armorUsed=true; this.say('「'+cr.c.d.name+'」の装甲が破壊を防いだ'); this.ev('armor',{uid:cr.c.uid}); return; }
    this.kill(cr);
  }
  bounce(cr){
    const p=this.owner(cr); if(!p) return;
    p.field.splice(p.field.indexOf(cr),1); cr.equips.forEach(e=>p.grave.push(e)); if(!cr.c.d.token) p.hand.push(cr.c);
    this.say('「'+cr.c.d.name+'」は手札に戻った','bounce'); this.ev('bounce',{p:p.i,uid:cr.c.uid});
  }

  // ---- effects ----
  needsTarget(x){ return ['weaken','destroy','dmg','bounce','freeze','tap','revive','buff','fight','pumpTarget','steal','polymorph','copyEnemy','ping','shuffleBack','morph','grant','evolve','sac'].includes(x.e) && !x.all; }
  needsPick(x){ return ['discover','scry'].includes(x.e); }
  candidates(p, x, src){
    const o=this.opp(p);
    switch(x.e){
      case 'weaken': case 'destroy': case 'dmg': case 'bounce': case 'freeze': case 'tap': case 'steal': case 'polymorph': case 'copyEnemy': case 'shuffleBack': case 'morph':
        return o.field.filter(c=>{
          if(x.tapped && !c.tapped) return false;
          if(x.damaged && !(c.dmg>0)) return false;
          if(x.minPower!=null && this.power(c)<x.minPower) return false;
          if(x.maxPower!=null && this.power(c)>x.maxPower) return false;
          if(x.maxCost!=null && c.c.d.cost>x.maxCost) return false;
          if(x.e==='tap' && c.stun) return false;
          return true;
        }).map(c=>c.c.uid);
      case 'ping': return ['player'].concat(o.field.map(c=>c.c.uid));
      case 'sac': return p.field.filter(c=>!src||c.c!==src).map(c=>c.c.uid);
      case 'revive': return p.grave.filter(c=>c.d.type==='creature'&&!c.d.token&&c!==src&&c.d.cost<=x.maxCost).map(c=>c.uid);
      case 'buff': case 'pumpTarget': case 'evolve': return p.field.map(c=>c.c.uid);
      case 'grant': return p.field.filter(c=>!this.hasKw(c,x.kw)).map(c=>c.c.uid);
      case 'fight': return p.field.length? o.field.map(c=>c.c.uid) : [];
    }
    return [];
  }
  // v2.6: コピー・進化・蘇生などで場に出たクリーチャーも登場時効果を発動する。
  // ただし、そうして発動した登場時効果の中の「クリーチャーを場に出す効果」は発動しない（無限連鎖の防止）。
  applyEffect(t){
    const ENTRY=Game.ENTRY;
    if(!ENTRY.has(t.eff.e)) return this.applyEffectCore(t);
    const before=new Set([...this.players[0].field,...this.players[1].field]);
    this.applyEffectCore(t);
    const depth=(t.depth||0)+1;
    this.players.forEach(q=>q.field.forEach(cr=>{
      if(before.has(cr) || cr.c.d.token) return;
      this.effs(cr).forEach(y=>{ if(y.t==='etb') this.queue.push({type:'effect',p:q.i,src:cr.c,eff:y,depth,snap:{combo:0}}); });
    }));
  }
  applyEffectCore(t){
    const p=this.players[t.p], o=this.opp(p), x=t.eff; let n=x.n;
    if(x.req && !this.reqOk(p, x.req, t, true)) return;
    if(x.bonus && this.reqOk(p, x.bonus.req, t, true)) n=(n||0)+x.bonus.n;
    if(x.scale){ n=(x.n||0)+this.scaleCount(p,x,t)*(x.k||1); if(x.max) n=Math.min(n,x.max); if(x.scale!=='boost' && !x.n && n<=0) return; }
    if(x.per==='attr'){ const a=t.src.d.attr[0]; n = x.n * p.field.filter(c=>c.c.d.attr.includes(a)).length; if(n<=0) return; }
    switch(x.e){
      case 'draw': this.draw(p,n); break;
      case 'damage': this.loseLife(o,n,'「'+t.src.d.name+'」'); break;
      case 'heal': this.gainLife(p,n); break;
      case 'lifecost': this.loseLife(p,n,'「'+t.src.d.name+'」'); break;
      case 'ramp': { const b=p.energyMax; p.energyMax=Math.min(ENERGY_MAX,p.energyMax+n); this.say(p.name+'の最大エナジー '+b+'→'+p.energyMax,'charge'); break; }
      case 'energyNow': p.energy=Math.min(ENERGY_MAX,p.energy+n); this.say(p.name+'のエナジー+'+n+'（このターン）','charge'); break;
      case 'discard': { const q=x.self?p:o; for(let i=0;i<n;i++){ if(q.hand.length===0) break; const k=this.rng.int(q.hand.length); const c=q.hand.splice(k,1)[0]; q.grave.push(c); q.souls++; this.say(q.name+'は「'+c.d.name+'」を捨てた','discard'); } break; }
      case 'buffAll': p.field.forEach(c=>{ if(!x.attr||c.c.d.attr.includes(x.attr)) c.tmp+=n; }); this.say(p.name+'のクリーチャーに、ターン終了時まで+'+n+'/+'+n); break;
      case 'pumpSelf': { const cr=this.findCr(t.src.uid); if(cr){ cr.pump+=n; this.say('「'+cr.c.d.name+'」に+'+n+'/+'+n); } break; }
      case 'destroyAll': o.field.slice().forEach(c=>{ if(x.tapped&&!c.tapped) return; if(x.damaged&&!(c.dmg>0)) return; if(x.maxPower!=null&&this.power(c)>x.maxPower) return; this.destroy(c); }); break;
      case 'bounceAll': o.field.slice().forEach(c=>this.bounce(c)); break;
      case 'tapAll': o.field.forEach(c=>{ c.tapped=true; c.stun=true; }); this.say(o.name+'のクリーチャーはすべてレストして気絶'); break;
      case 'destroy': { const c=this.findCr(t.choice); if(c) this.destroy(c); break; }
      case 'dmg': { const c=this.findCr(t.choice); if(c) this.dealDamage(c,n); break; }
      case 'dmgAll': o.field.slice().forEach(c=>this.dealDamage(c,n,false)); this.checkDeaths(); break;
      case 'bounce': { const c=this.findCr(t.choice); if(c) this.bounce(c); break; }
      case 'freeze': { const c=this.findCr(t.choice); if(c){ c.tapped=true; c.frozen=true; c.stun=true; this.say('「'+c.c.d.name+'」は凍結した'); } break; }
      case 'tap': { const c=this.findCr(t.choice); if(c){ c.tapped=true; c.stun=true; this.say('「'+c.c.d.name+'」はレストして気絶した'); } break; }
      case 'buff': { const c=this.findCr(t.choice); if(c){ c.tmp+=n; this.say('「'+c.c.d.name+'」に、ターン終了時まで+'+n+'/+'+n); } break; }
      case 'pumpTarget': { const c=this.findCr(t.choice); if(c){ c.pump+=n; this.say('「'+c.c.d.name+'」に+'+n+'/+'+n+'（永続）'); } break; }
      case 'fight': { const c=this.findCr(t.choice); const mine=p.field.slice().sort((a,b)=>this.power(b)-this.power(a))[0]; if(c&&mine){ this.say('「'+mine.c.d.name+'」が「'+c.c.d.name+'」と戦闘'); this.battle(mine,c,n||0); } break; }
      case 'freezeAll': o.field.forEach(c=>{ c.tapped=true; c.frozen=true; c.stun=true; }); this.say(o.name+'のクリーチャーはすべて凍結'); break;
      case 'selfDestroy': { const cr=this.findCr(t.src.uid); if(cr) this.destroy(cr); break; }
      case 'steal': { const c=this.findCr(t.choice); if(c && p.field.length<FIELD_MAX){ o.field.splice(o.field.indexOf(c),1); c.sick=true; c.tapped=false; c.attacked=false; p.field.push(c); this.say(p.name+'は「'+c.c.d.name+'」のコントロールを奪った','play'); } break; }
      case 'swapBoards': { const a=p.field, b=o.field; p.field=b; o.field=a; [...p.field,...o.field].forEach(c=>{ c.sick=true; }); this.say('場のクリーチャーがすべて入れ替わった！','play'); break; }
      case 'swapLife': { const a=p.life; p.life=o.life; o.life=a; this.say('ライフが入れ替わった！ '+p.name+' '+p.life+' / '+o.name+' '+o.life,'life'); this.checkWin(); break; }
      case 'cloneSelf': { const cr=this.findCr(t.src.uid); if(cr && p.field.length<FIELD_MAX){ const nc=this.mkCr(this.inst(cr.c.d)); nc.pump=cr.pump; p.field.push(nc); this.say('「'+cr.c.d.name+'」のコピーが現れた','play'); } break; }
      case 'polymorph': { const c=this.findCr(t.choice); if(c){ const i=o.field.indexOf(c); const nc=this.mkCr(this.inst(AN.FROG)); nc.sick=c.sick; nc.tapped=c.tapped; o.field[i]=nc; this.say('「'+c.c.d.name+'」はカエルになった','play'); } break; }
      case 'equalize': { [...p.field,...o.field].forEach(c=>{ c.fixed=n; c.pump=0; c.dmg=0; }); this.say('すべてのクリーチャーが'+n+'/'+n+'になった','play'); break; }
      case 'mill': { let k=0; for(let i=0;i<n;i++){ if(!o.deck.length) break; o.grave.push(o.deck.pop()); k++; } this.say(o.name+'の山札から'+k+'枚が墓地へ','discard'); break; }
      case 'handRefresh': { [p,o].forEach(q=>{ const k=q.hand.length; q.hand.forEach(c=>q.grave.push(c)); q.hand=[]; this.draw(q,k,true); this.say(q.name+'は手札'+k+'枚を引き直した','draw'); }); break; }
      case 'massRevive': { [p,o].forEach(q=>{ const cs=q.grave.filter(c=>c.d.type==='creature'&&!c.d.token&&c!==t.src).sort((a,b)=>b.d.cost-a.d.cost); let k=0; for(const c of cs){ if(q.field.length>=FIELD_MAX) break; q.grave.splice(q.grave.indexOf(c),1); q.field.push(this.mkCr(c)); k++; } this.say(q.name+'の墓地から'+k+'体が蘇った','play'); }); break; }
      case 'dmgAllBoth': { [...p.field,...o.field].forEach(c=>this.dealDamage(c,n,false)); this.checkDeaths(); break; }
      case 'toHand': { const c=t.src; if(p.grave.includes(c)){ p.grave.splice(p.grave.indexOf(c),1); p.hand.push(c); this.say('「'+c.d.name+'」は手札に戻った','bounce'); } break; }
      case 'sacrifice': { const cr=this.findCr(t.src.uid); if(cr){ const others=p.field.filter(c=>c!==cr); others.forEach(c=>this.kill(c)); cr.pump+=others.length*3; this.say('「'+cr.c.d.name+'」は'+others.length+'体を生贄にして+'+(others.length*3)+'/+'+(others.length*3),'play'); } break; }
      case 'coin': { if(this.rng()<0.5){ this.say('コインは表！','play'); o.field.slice().forEach(c=>this.dealDamage(c,5,false)); this.checkDeaths(); } else { this.say('コインは裏…','play'); this.loseLife(p,5,'コイン'); } break; }
      case 'copyEnemy': { const c=this.findCr(t.choice); if(c && p.field.length<FIELD_MAX){ p.field.push(this.mkCr(this.inst(c.c.d))); this.say(p.name+'は「'+c.c.d.name+'」のコピーを出した','play'); } break; }
      case 'resetAll': { [p,o].forEach(q=>q.field.slice().forEach(c=>this.bounce(c))); break; }
      case 'graveSteal': { const cs=o.grave.filter(c=>c.d.type==='creature'&&!c.d.token).sort((a,b)=>b.d.cost-a.d.cost); if(cs.length && p.field.length<FIELD_MAX){ const c=cs[0]; o.grave.splice(o.grave.indexOf(c),1); p.field.push(this.mkCr(c)); this.say(p.name+'は相手の墓地から「'+c.d.name+'」を奪った','play'); } break; }
      case 'silenceAll': { o.field.forEach(c=>{ c.silenced=true; c.grants=[]; }); this.say(o.name+'のクリーチャーは能力を失った','play'); break; }
      case 'tokens': { const tok=AN.TOKENS[x.tok||'none']; const q=x.opp?o:p; let k=0; for(let i=0;i<n;i++){ if(q.field.length>=FIELD_MAX) break; q.field.push(this.mkCr(this.inst(tok))); k++; } this.say(q.name+'の場に「'+tok.name+'」が'+k+'体出た','play'); for(let i=0;i<k;i++) this.trigger(q,'summon',null); break; }
      case 'discover': { const o2=t.opts[t.choice]; if(o2){ p.hand.push(this.inst(o2.d)); this.say(p.name+'は「'+o2.d.name+'」を発見した','draw'); } break; }
      case 'scry': { const o2=t.opts[t.choice]; if(o2){ const i=p.deck.indexOf(o2.card); if(i>=0) p.deck.splice(i,1); if(x.discount) o2.card.cm=(o2.card.cm||0)+x.discount; p.hand.push(o2.card); t.opts.forEach(z=>{ if(z!==o2){ const j=p.deck.indexOf(z.card); if(j>=0){ p.deck.splice(j,1); p.deck.unshift(z.card); } } }); this.say(p.name+'は山札から「'+o2.d.name+'」を手札に加え、残りを下に置いた','draw'); } break; }
      case 'randomDmg': { for(let i=0;i<n;i++){ const tg=['player'].concat(o.field.filter(c=>this.health(c)>0)); const pick=tg[this.rng.int(tg.length)]; if(pick==='player') this.loseLife(o,1,t.src.d.name); else this.dealDamage(pick,1); if(this.winner!=null) break; } break; }
      case 'randomCard': { const pool=this.poolFor(p); const d=pool[this.rng.int(pool.length)]; p.hand.push(this.inst(d)); this.say(p.name+'は「'+d.name+'」を手札に加えた','draw'); break; }
      case 'tutor': { const cs=p.deck.filter(c=>c.d.type==='creature'); if(cs.length){ const c=cs[this.rng.int(cs.length)]; p.deck.splice(p.deck.indexOf(c),1); p.hand.push(c); this.say(p.name+'は山札から「'+c.d.name+'」を手札に加えた','draw'); } break; }
      case 'shuffleBack': { const c=this.findCr(t.choice); if(c){ o.field.splice(o.field.indexOf(c),1); c.equips.forEach(e=>o.grave.push(e)); if(!c.c.d.token){ o.deck.splice(this.rng.int(o.deck.length+1),0,c.c); } this.say('「'+c.c.d.name+'」は山札に戻された','bounce'); } break; }
      case 'morph': { const c=this.findCr(t.choice); if(c){ const cs=AN.CARDS.filter(d=>d.type==='creature'&&d.cost===c.c.d.cost&&d.id!==c.c.d.id); if(cs.length){ const d=cs[this.rng.int(cs.length)]; const i=o.field.indexOf(c); const nc=this.mkCr(this.inst(d)); nc.sick=c.sick; nc.tapped=c.tapped; o.field[i]=nc; this.say('「'+c.c.d.name+'」は「'+d.name+'」に変身した','play'); } } break; }
      case 'weaken': { const c=this.findCr(t.choice); if(c && AN.RULES.armorWeaken && this.hasKw(c,'armor') && !c.armorUsed){ c.armorUsed=true; this.say('「'+c.c.d.name+'」の装甲が弱体化を防いだ'); break; } if(c){ c.pump-=n; this.say('「'+c.c.d.name+'」に-'+n+'/-'+n,'battle'); this.checkDeaths(); } break; }
      case 'weakenAll': { o.field.forEach(c=>{ if(AN.RULES.armorWeaken && this.hasKw(c,'armor') && !c.armorUsed){ c.armorUsed=true; return; } c.pump-=n; }); this.say(o.name+'のクリーチャーすべてに-'+n+'/-'+n,'battle'); this.checkDeaths(); break; }
      case 'stealTop': { const cs=o.field.slice().sort((a,b)=>this.power(b)-this.power(a)).slice(0,n); cs.forEach(c=>{ if(p.field.length>=FIELD_MAX) return; o.field.splice(o.field.indexOf(c),1); c.sick=true; c.tapped=false; c.attacked=false; p.field.push(c); this.say(p.name+'は「'+c.c.d.name+'」を支配した','play'); }); break; }
      case 'wipeGrow': { const me=this.findCr(t.src.uid); let k=0; [p,o].forEach(q=>q.field.slice().forEach(c=>{ if(c!==me){ const before=q.field.length; this.destroy(c); if(q.field.length<before) k++; } })); if(me){ me.pump+=k; } this.say('世界が終わった（'+k+'体が破壊され、+'+k+'/+'+k+'）','destroy'); break; }
      case 'extraTurn': { p.extraTurn=true; this.say(p.name+'は時を支配した。このターンの後、もう一度ターンを得る','play'); break; }
      case 'copyOppHand': { let k=0; o.hand.forEach(c=>{ if(p.hand.length>=HAND_MAX) return; p.hand.push(this.inst(c.d)); k++; }); this.say(p.name+'は相手の手札'+k+'枚を写し取った','draw'); break; }
      case 'reviveRandom': { const cs=this.rng.shuffle(p.grave.filter(c=>c.d.type==='creature'&&!c.d.token&&c!==t.src)).slice(0,n); cs.forEach(c=>{ if(p.field.length>=FIELD_MAX) return; p.grave.splice(p.grave.indexOf(c),1); p.field.push(this.mkCr(c)); this.say('「'+c.d.name+'」が冥府から戻った','play'); }); break; }
      case 'halveLife': { p.life=Math.ceil(p.life/2); this.say(p.name+'のライフは'+p.life+'になった','life'); break; }
      case 'tokensRandom': { let k=0; for(let i=0;i<n;i++){ if(p.field.length>=FIELD_MAX) break; const tok=AN.TOKENS[x.pool[this.rng.int(x.pool.length)]]; p.field.push(this.mkCr(this.inst(tok))); this.say(p.name+'の場に「'+tok.name+'」が出た','play'); k++; } break; }
      case 'dmgOthers': { const me=this.findCr(t.src.uid); [...p.field,...o.field].forEach(c=>{ if(c!==me) this.dealDamage(c,n,false); }); this.checkDeaths(); break; }
      case 'addDream': { if(p.hand.length<HAND_MAX){ const keys=['dream_blade','dream_wake','dream_wing','dream_heal','dream_rise']; const sp=AN.SPECIAL[keys[this.rng.int(keys.length)]]; p.hand.push(this.inst(sp)); this.say(p.name+'の手札に夢カード「'+sp.name+'」が加わった','draw'); } break; }
      case 'becomeLord': { p.life=n; p.leaderOverride=AN.LEADER_EX[x.leader]; p.abilityUsed=false; this.say(p.name+'は魔王となった！ライフ'+n+'・リーダー能力「'+p.leaderOverride.name+'」','play'); this.checkWin(); break; }
      case 'boomDmg': { const tg=['player'].concat(o.field.filter(c=>this.health(c)>0)); const pick=tg[this.rng.int(tg.length)]; const d=1+this.rng.int(4); if(pick==='player') this.loseLife(o,d,t.src.d.name); else this.dealDamage(pick,d); break; }
      case 'wipeOthers': { const me=this.findCr(t.src.uid); [p,o].forEach(q=>q.field.slice().forEach(c=>{ if(c!==me) this.destroy(c); })); this.say('場が焼き払われた','destroy'); break; }
      case 'discardSelfAll': { const k=p.hand.length; p.hand.forEach(c=>{ p.grave.push(c); p.souls++; }); p.hand=[]; this.say(p.name+'は手札'+k+'枚を捨てた','discard'); break; }
      case 'bigRandom': { const tg=['player'].concat(o.field.filter(c=>this.health(c)>0)); const pick=tg[this.rng.int(tg.length)]; if(pick==='player') this.loseLife(o,n,t.src.d.name); else this.dealDamage(pick,n); break; }
      case 'setLeader': { p.leaderOverride=AN.LEADER_EX[x.leader]; p.abilityUsed=false; this.say(p.name+'のリーダー能力が「'+p.leaderOverride.name+'」になった','play'); break; }
      case 'swapLeader': { const a=this.leaderDef(p), b=this.leaderDef(o); p.leaderOverride=b; o.leaderOverride=a; this.say('リーダー能力が入れ替わった！（'+p.name+'：'+(b?b.name:'なし')+'／'+o.name+'：'+(a?a.name:'なし')+'）','play'); break; }
      case 'pumpRandomAlly': { if(p.field.length){ const c=p.field[this.rng.int(p.field.length)]; c.pump+=n; this.say('「'+c.c.d.name+'」に+'+n+'/+'+n); } break; }
      case 'weakenRandom': { if(o.field.length){ const c=o.field[this.rng.int(o.field.length)]; c.pump-=n; this.say('「'+c.c.d.name+'」に-'+n+'/-'+n,'battle'); this.checkDeaths(); } break; }
      case 'counter': break;
      case 'randomDmgCr': { const cs=o.field.filter(c=>this.health(c)>0); if(cs.length) this.dealDamage(cs[this.rng.int(cs.length)], n); break; }
      case 'pumpAll': { p.field.forEach(c=>c.pump+=n); this.say(p.name+'のクリーチャーすべてに+'+n+'/+'+n,'play'); break; }
      case 'boostHand': { this.boostHand(p,n); this.say(p.name+'の手札の詠唱+'+n); break; }
      case 'sac': { const c=this.findCr(t.choice); if(c) this.kill(c); break; }
      case 'gainSouls': { p.souls+=n; break; }
      case 'recallSpell': { const cs=p.grave.filter(c=>c.d.type==='spell'&&!c.d.special); if(cs.length&&p.hand.length<HAND_MAX){ const c=cs[this.rng.int(cs.length)]; p.hand.push(this.inst(c.d)); this.say(p.name+'は「'+c.d.name+'」のコピーを手札に加えた','draw'); } break; }
      case 'devour': { const cr=this.findCr(t.src.uid); const k=p.souls; if(cr&&k>0){ p.souls=0; cr.pump+=k; this.say('「'+cr.c.d.name+'」は供物'+k+'を喰らい+'+k+'/+'+k,'play'); } break; }
      case 'reviveAllSelf': { const cs=p.grave.filter(c=>c.d.type==='creature'&&!c.d.token&&c!==t.src).sort((a,b)=>b.d.cost-a.d.cost); let k=0; for(const c of cs){ if(p.field.length>=FIELD_MAX) break; p.grave.splice(p.grave.indexOf(c),1); p.field.push(this.mkCr(c)); k++; } this.say(p.name+'の墓地から'+k+'体が蘇った','play'); break; }
      // ---- weird ----
      case 'swapHands': { const a=p.hand; p.hand=o.hand; o.hand=a; this.say('お互いの手札が入れ替わった！','play'); break; }
      case 'shiftSelf': { const i=p.hand.indexOf(t.src); if(i>=0){ const cs=AN.CARDS.filter(d=>d.cost===t.src.d.cost); if(cs.length){ const d=cs[this.rng.int(cs.length)]; p.hand[i]=this.inst(d); this.say(p.name+'の手札の「'+t.src.d.name+'」が「'+d.name+'」に変わった','draw'); } } break; }
      case 'giveSelf': { const cr=this.findCr(t.src.uid); if(cr && p.field.includes(cr) && o.field.length<FIELD_MAX){ p.field.splice(p.field.indexOf(cr),1); cr.sick=true; o.field.push(cr); this.say('「'+cr.c.d.name+'」は'+o.name+'のもとへ去った','play'); } break; }

  poolFor(p){ const a=p.main; return AN.CARDS.filter(c=>c.attr.length===0 || (a && c.attr.includes(a))); }

  exec(t){

        if((t.depth||0)>=1 && Game.ENTRY.has(t.eff.e)){ this.say('「'+t.src.d.name+'」の「'+AN.effectText(t.eff).replace(/。$/,'')+'」は連鎖防止のため発動しない'); return; }

// ===== ANOMALY ai.js =====
var AN = (typeof AN !== 'undefined') ? AN : (typeof require!=='undefined' ? require('./engine.js') : {});
(function(){
const LV = { 1:{name:'弱', block:0.0, smart:false, rnd:0.5}, 2:{name:'中', block:0.7, smart:true, rnd:0.15}, 3:{name:'強', block:1.0, smart:true, rnd:0.0} };

// ---- deck auto build from 90 pool ----
function bestMain(pool){
  let best=null, bv=-1;
  AN.ATTR_ORDER.forEach(a=>{ const cs=pool.filter(d=>d.attr.includes(a)); const v=cs.reduce((s,d)=>s+AN.cardValue(d),0)+cs.length*0.5; if(v>bv){bv=v;best=a;} });
  return best;
}
function autoDeck(pool, rng, main){
  const ok=d=>d.anomaly || d.attr.length===0 || (main? d.attr.includes(main) : true);
  const cands=pool.filter(ok).map(d=>({d, v:AN.cardValue(d)/Math.max(1,d.cost)*(d.cost<=4?1.15:1) + (d.anomaly?(d.weird?1:3):0) + (main&&d.attr.includes(main)?0.8:0) + (rng?rng()*0.3:0)}));
  cands.sort((a,b)=>b.v-a.v);
  const N=AN.CONST.DECK_SIZE;
  let deck=cands.slice(0,N).map(x=>x.d);
  if(deck.length<N){ const rest=pool.filter(d=>!ok(d)).map(d=>({d,v:AN.cardValue(d)})).sort((a,b)=>b.v-a.v); for(const r of rest){ if(deck.length>=N) break; deck.push(r.d); } }
  return deck.slice(0,N);
}

function lp(g,c){ return g.hasKw(c,'deathtouch')&&g.power(c)>0 ? 99 : g.power(c); }
function creatureThreat(g, cr){ return g.power(cr)+g.health(cr)*0.5+ (g.hasKw(cr,'unblockable')?2:0)+(g.hasKw(cr,'breakthrough')?1:0)+cr.c.d.effects.length; }

// ---- chooser ----
function chooser(level){
  const L=LV[level];
  return function(g, q){
    const p=g.players[q.p], o=g.opp(p);
    if(q.type==='target'){
      const e=q.eff.e;
      if(e==='ping'){
        const crs=q.cands.filter(u=>u!=='player').map(u=>g.findCr(u)).filter(Boolean);
        const k=crs.filter(c=>g.health(c)<=q.eff.n && !(g.hasKw(c,'armor')&&!c.armorUsed)).sort((a,b)=>creatureThreat(g,b)-creatureThreat(g,a));
        if(k.length) return k[0].c.uid;
        return 'player';
      }
      if(e==='weaken'){ const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); const nn=q.eff.n+(q.eff.bonus&&g.reqOk(p,q.eff.bonus.req,{},false)?q.eff.bonus.n:0); const k=crs.filter(c=>g.health(c)<=nn); const L2=(k.length?k:crs).sort((x,y)=>creatureThreat(g,y)-creatureThreat(g,x)); return L2[0].c.uid; }
      if(['destroy','dmg','bounce','freeze','tap','steal','polymorph','copyEnemy','shuffleBack','morph'].includes(e)){
        const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean);
        crs.sort((a,b)=>creatureThreat(g,b)-creatureThreat(g,a));
        if(e==='dmg'){ const k=crs.filter(c=>g.health(c)<=q.eff.n && !(g.hasKw(c,'armor')&&!c.armorUsed)); if(k.length) return k[0].c.uid; }
        if(e==='tap'||e==='freeze'){ const un=crs.filter(c=>!c.stun); const ready=p.field.filter(c=>g.canAttackWith(p,c)); const k=un.filter(c=>ready.some(a=>g.power(a)>=g.health(c)&&g.power(c)>=g.health(a))); if(k.length) return k[0].c.uid; if(un.length) return un[0].c.uid; }
        return crs[0].c.uid;
      }
      if(e==='revive'){ const cs=q.cands.map(u=>p.grave.find(c=>c.uid===u)); cs.sort((a,b)=>b.d.cost-a.d.cost); return cs[0].uid; }
      if(e==='fight'){
        const mine=p.field.slice().sort((a,b)=>g.power(b)-g.power(a))[0]; const pm=g.power(mine)+(q.eff.n||0);
        const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean);
        const kill=crs.filter(c=>g.power(c)<pm).sort((a,b)=>creatureThreat(g,b)-creatureThreat(g,a));
        if(kill.length) return kill[0].c.uid;
        crs.sort((a,b)=>g.power(a)-g.power(b)); return crs[0].c.uid;
      }
      if(e==='sac'){ const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); crs.sort((a,b)=>(AN.cardValue(a.c.d)-(a.c.d.token?3:0))-(AN.cardValue(b.c.d)-(b.c.d.token?3:0))); return crs[0].c.uid; }
      if(e==='grant'){
        const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); const kw=q.eff.kw;
        if(kw==='haste'){ const sk=crs.filter(c=>c.sick&&!c.attacked); if(sk.length) return sk.sort((a,b)=>g.power(b)-g.power(a))[0].c.uid; }
        if(kw==='blocker'||kw==='armor'){ crs.sort((a,b)=>g.health(b)-g.health(a)); return crs[0].c.uid; }
        crs.sort((a,b)=>g.power(b)-g.power(a)); return crs[0].c.uid;
      }
      if(e==='evolve'){ const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); crs.sort((a,b)=>(AN.cardValue(a.c.d)-a.dmg)-(AN.cardValue(b.c.d)-b.dmg)); return crs[0].c.uid; }
      if(e==='pumpTarget'){ const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); crs.sort((a,b)=>(g.power(b)+(b.tapped?-2:0))-(g.power(a)+(a.tapped?-2:0))); return crs[0].c.uid; }
      if(e==='buff'){ const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean); const ready=crs.filter(c=>!c.tapped&&(!c.sick||g.hasKw(c,'haste'))); (ready.length?ready:crs).sort((a,b)=>g.power(b)-g.power(a)); return (ready.length?ready:crs)[0].c.uid; }
      return q.cands[0];
    }
    if(q.type==='pick'){
      let best=0, bv=-1;
      q.opts.forEach((o2,i)=>{ let v=AN.cardValue(o2.d); if(o2.d.cost>p.energyMax+2) v-=1; if(v>bv){bv=v;best=i;} });
      return best;
    }
    if(q.type==='equip'){
      const crs=q.cands.map(u=>g.findCr(u)).filter(Boolean);
      crs.sort((a,b)=>(g.power(b)+(b.tapped?-1:0))-(g.power(a)+(a.tapped?-1:0)));
      return crs[0].c.uid;
    }
    if(q.type==='block'){
      if(g.rng()>=L.block) return null;
      const atk=g.findCr(q.attacker); const pa=g.power(atk);
      const blockers=q.cands.map(u=>g.findCr(u)).filter(Boolean);
      const incoming = q.target==='player' ? pa : 0;
      // kill it without dying
      const ha=g.health(atk);
      const win=blockers.filter(b=>g.power(b)>=ha && g.health(b)>pa).sort((a,b)=>g.power(a)-g.power(b));
      if(win.length) return win[0].c.uid;
      const surv=blockers.filter(b=>g.health(b)>pa).sort((a,b)=>g.power(b)-g.power(a));
      if(surv.length && incoming>0) return surv[0].c.uid;
      // survive via armor
      const arm=blockers.filter(b=>g.hasKw(b,'armor')&&!b.armorUsed);
      if(arm.length && incoming>0) return arm[0].c.uid;

          const worth=creatureThreat(g,c)+g.power(c)*1.2, loss=atkDies(c)? creatureThreat(g,cr)*0.7 : 0;
          let sc=-99;
          if(g.health(c)<=pw) sc=worth-loss;                                  // この1体で倒せる
          else if(teamPow>=g.health(c)) sc=worth*0.8-loss-0.5;                  // 残りの攻撃と合わせれば倒せる
          else if(!atkDies(c) && g.power(c)>=3) sc=g.power(c)*0.4;             // 生き残れるなら削っておく（ダメージは残る）
          return {c,sc}; }).sort((x,y)=>y.sc-x.sc);
        if(opts.length && opts[0].sc>0.5 && g.attack(p,cr,opts[0].c.c.uid)) return 'attack';
      }
      if(canFace){
        if(!L.smart || lethal || o.life<=facePw) target='player';
        else if(kills.length && o.life>facePw*2 && creatureThreat(g,kills[0])>=Math.max(2,pw-3)) target=kills[0].c.uid;
        else if(trades.length && o.life>facePw*2 && (AN.cardValue(trades[0].c.d)>myVal || theirPow>myPow)) target=trades[0].c.uid;
        else target='player';
        if(!L.smart && g.rng()<0.15) target=null;
      } else {
        // must attack a guard: do it if we kill it, or trade favourably, or when racing
        if(kills.length) target=kills[0].c.uid;
        else if(trades.length && (AN.cardValue(trades[0].c.d)>=myVal-1 || theirPow>myPow)) target=trades[0].c.uid;
        else if(!L.smart || lethal || g.turn>30 || p.deck.length<=3) target=crs.sort((a,b)=>g.health(a)-g.health(b))[0].c.uid;
        else {
          // chip damage into the guard when it dies to two hits and we survive
          const soft=crs.filter(c=>lp(g,c)<myH).sort((a,b)=>g.health(a)-g.health(b));
          if(soft.length && ready.length>=2) target=soft[0].c.uid;
        }
      }
      if(target && g.attack(p,cr,target)) return 'attack';
    }
  }
  g.endTurn(); return null;
}

function bossDeck(boss, rng){
  if(boss.special==='anomaly'){
    const pool=[];
    AN.CARDS.forEach(d=>{ if(d.rarity!=='C') pool.push(d); });
    const an=[];
    for(let i=0;i<boss.legends;i++) an.push(AN.makeLegend(rng, 9100+i*3));
    for(let i=0;i<boss.anomalies-boss.legends;i++) an.push(AN.makeAnomaly(rng, 9101+i, null));
    const rest=autoDeck(pool, rng, null).slice(0, 30-an.length);
    return {pool: an.concat(pool), deck: an.concat(rest)};
  }
  const pool=[];
  const okR = boss.tier===1 ? ['C','U'] : boss.tier===2 ? ['C','U','R'] : ['C','U','R','L'];
  AN.CARDS.forEach(d=>{ if((d.attr.includes(boss.attr) || d.attr.length===0) && okR.includes(d.rarity)){ const k=d.rarity==='L'?1:2; for(let i=0;i<k;i++) pool.push(d); } });
  for(let i=0;i<boss.legends;i++) pool.unshift(AN.makeLegend(rng, 9000+i*3));
  for(let i=0;i<boss.anomalies-boss.legends;i++) pool.unshift(AN.makeAnomaly(rng, 9001+i*3, null));
  const deck=autoDeck(pool, rng, boss.attr);
  // 伝説は必ず入れる
  pool.filter(d=>d.legend).forEach(d=>{ if(!deck.includes(d)){ deck.pop(); deck.unshift(d); } });
  return {pool, deck};
}

// ===== ANOMALY net.js ===== room/action transport. LocalNet = same browser (tabs) via localStorage+BroadcastChannel. FirebaseNet = Realtime Database.
(function(){
const CODE_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeCode(){ let s=''; for(let i=0;i<4;i++) s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return s; }
function setPath(obj, path, value){ const ks=path.split('/'); let o=obj; for(let i=0;i<ks.length-1;i++){ if(o[ks[i]]==null||typeof o[ks[i]]!=='object') o[ks[i]]={}; o=o[ks[i]]; } o[ks[ks.length-1]]=value; }

// ---------- LocalNet ----------
class LocalNet {
  constructor(){ this.kind='local'; this.key='anom_rooms_v2'; this.bc=('BroadcastChannel' in window)? new BroadcastChannel('anomaly_net') : null; this.watchers=[];
    const onMsg=()=>this.watchers.forEach(w=>w());
    if(this.bc) this.bc.onmessage=onMsg;
    window.addEventListener('storage',e=>{ if(e.key===this.key) onMsg(); });
  }
  _all(){ try{ return JSON.parse(localStorage.getItem(this.key))||{}; }catch(e){ return {}; } }
  _save(all){ localStorage.setItem(this.key, JSON.stringify(all)); if(this.bc) this.bc.postMessage('x'); this.watchers.forEach(w=>w()); }
  async createRoom(data){ const all=this._all(); let code=makeCode(); while(all[code]) code=makeCode(); all[code]=Object.assign({code, games:{}},data); this._save(all); return code; }
  async getRoom(code){ const r=this._all()[code]; return r? JSON.parse(JSON.stringify(r)) : null; }
  async set(code, path, value){ const all=this._all(); if(!all[code]) return; setPath(all[code], path, value); this._save(all); }
  watchRoom(code, cb){ const f=()=>{ const r=this._all()[code]; if(r) cb(JSON.parse(JSON.stringify(r))); }; this.watchers.push(f); f(); return ()=>{ this.watchers=this.watchers.filter(x=>x!==f); }; }
  async pushAction(code, gameNo, a){ const all=this._all(); const r=all[code]; if(!r) return; r.games=r.games||{}; r.games[gameNo]=r.games[gameNo]||{}; r.games[gameNo].actions=r.games[gameNo].actions||[]; r.games[gameNo].actions.push(a); this._save(all); }
  watchActions(code, gameNo, cb){ let seen=0; const f=()=>{ const r=this._all()[code]; const list=(r&&r.games&&r.games[gameNo]&&r.games[gameNo].actions)||[]; while(seen<list.length){ cb(list[seen], seen); seen++; } }; this.watchers.push(f); f(); return ()=>{ this.watchers=this.watchers.filter(x=>x!==f); }; }
}

// ---------- FirebaseNet (compat SDK loaded from gstatic; only works on a normal web host) ----------
class FirebaseNet {
  constructor(cfg){ this.kind='firebase'; if(!firebase.apps.length) firebase.initializeApp(cfg); this.db=firebase.database(); }
  ref(p){ return this.db.ref('rooms/'+p); }
  async createRoom(data){ let code=makeCode(); for(let i=0;i<5;i++){ const snap=await this.ref(code).get(); if(!snap.exists()) break; code=makeCode(); } await this.ref(code).set(Object.assign({code},data)); return code; }
  async getRoom(code){ const snap=await this.ref(code).get(); return snap.exists()? snap.val() : null; }
  async set(code, path, value){ await this.ref(code+'/'+path).set(value); }
  watchRoom(code, cb){ const r=this.ref(code); const h=r.on('value',s=>{ if(s.exists()) cb(s.val()); }); return ()=>r.off('value',h); }
  async pushAction(code, gameNo, a){ await this.ref(code+'/games/'+gameNo+'/actions').push(a); }
  watchActions(code, gameNo, cb){ const r=this.ref(code+'/games/'+gameNo+'/actions'); let i=0; const h=r.on('child_added',s=>{ cb(s.val(), i++); }); return ()=>r.off('child_added',h); }
}

function createNet(cfg){
  if(cfg && cfg.apiKey && typeof firebase!=='undefined' && firebase.database){ try{ return new FirebaseNet(cfg); }catch(e){ console.warn('firebase init failed',e); } }
  return new LocalNet();
}
window.AN_NET={createNet, LocalNet, FirebaseNet, makeCode};
})();

// ---------------- BGM（v3.15：Sunoで作った曲をループ再生）----------------
// 曲ファイル bgm/<key>.mp3 は、前後に「曲の終わり1秒」「曲の始まり1秒」をつなぎ足してある。
// その内側 [PRE, PRE+len] をループさせるので、ブラウザが mp3 の頭や末尾に無音を足しても継ぎ目が途切れない。
// gain は曲ごとの音量差を -18 LUFS にそろえる倍率。
const BGM_PRE=1.0, BGM_TRACKS={"title": {"len": 17.60071, "gain": 0.822}, "map": {"len": 20.7735, "gain": 0.668}, "battle": {"len": 20.76115, "gain": 1.012}, "boss": {"len": 20.77146, "gain": 0.822}, "final": {"len": 20.76167, "gain": 0.759}, "judge": {"len": 14.96102, "gain": 0.638}, "tavern": {"len": 19.8975, "gain": 0.617}};
const MLS='anomaly_music_v1';
let music={on:true, vol:0.5}; try{ Object.assign(music, JSON.parse(localStorage.getItem(MLS))||{}); }catch(e){}
let mbus=null, want=null, curKey=null, curNode=null; const mbuf={}, mload={};

function mLoad(key){ // 1曲を取り込んで復号する（同じ曲は一度だけ）
  if(mbuf[key]) return Promise.resolve(mbuf[key]); if(mload[key]) return mload[key];
  return mload[key]=fetch('bgm/'+key+'.mp3').then(r=>{ if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
    .then(b=>new Promise((ok,ng)=>ac.decodeAudioData(b,ok,ng))).then(buf=>{ mbuf[key]=buf; mTrim(); return buf; })
    .catch(e=>{ delete mload[key]; return null; });
}
function mTrim(){ const keys=Object.keys(mbuf); if(keys.length<=3) return; keys.forEach(k=>{ if(Object.keys(mbuf).length>3 && k!==curKey && k!==want){ delete mbuf[k]; delete mload[k]; } }); } // メモリ節約：復号済みは3曲まで

        t=impactAt; mark(t+600);
        break;
      }
      case 'dmg': {
        const w=where(e.uid); if(!w) break; const r=w.r;
        impact(r.cx,r.cy,'#FF7A45','#FFF1C8',Math.min(1.5,0.7+e.n*0.1),t);
        num(r, '-'+e.n, 'dmg'+(e.n>=5?' big':''), t);
        if(w.el) hitCard(w.el, t);
        shake(Math.min(9,2+e.n*0.9),220,t);
        later(t, 'hit', e.n, panOf(r)); mark(t+700);
        break;
      }
      case 'armor': { const w=where(e.uid); if(w){ const r=w.r; add({k:'ring',x:r.cx,y:r.cy,r0:r.w*0.4,r1:r.w*0.9,w:8,col:'#BFD8EA',hot:'#FFFFFF',life:500,delay:t}); add({k:'glow',x:r.cx,y:r.cy,r0:10,r1:70,col:'#BFD8EA',life:350,delay:t}); sparks(r.cx,r.cy,20,'#CFE3F0','#FFFFFF',{delay:t,max:9}); num(r,'装甲','shield',t); if(w.el) anim(w.el,[{filter:'brightness(1)'},{filter:'brightness(2.4) saturate(0)'},{filter:'brightness(1)'}],{duration:380,delay:t}); later(t,'armor',null,panOf(r)); } mark(t+600); break; }
      case 'destroy': {
        const o=prev.cards[e.uid]; const at=t+140;
        if(o) shatter(o, at); else { const w=where(e.uid); if(w) impact(w.r.cx,w.r.cy,'#FFFFFF','#FFFFFF',1.2,at); }
        later(at+170, 'destroy', null, o?panOf(o.r):0); mark(at+1100);
        break;
      }
      case 'bounce': { const o=prev.cards[e.uid]; if(o){ const g=cloneAt(o); const dy=e.p===me?90:-90; const an=anim(g,[{transform:'none',opacity:1,filter:'brightness(1) blur(0)'},{transform:'translateY('+dy*0.2+'px) scale(1.05)',filter:'brightness(1.8) blur(0)',offset:0.3},{transform:'translateY('+dy+'px) scale(.7)',opacity:0,filter:'brightness(2) blur(3px)'}],{duration:480,delay:t,fill:'both',easing:'ease-in'}); if(an) an.onfinish=()=>g.remove(); setTimeout(()=>g.remove(),t+600); add({k:'ring',x:o.r.cx,y:o.r.cy,r0:10,r1:70,w:5,col:'#9FE3FF',life:420,delay:t}); later(t,'bounce',null,panOf(o.r)); } mark(t+600); break; }
      case 'life': {
        const el=lifeEl(e.p); const r=rectOf(el);
        if(e.n<0){ const n=-e.n; const mine=e.p===me;
          if(r){ impact(r.cx,r.cy,'#FF5A3C','#FFE3B0',Math.min(1.8,0.8+n*0.1),t); smoke(r.cx,r.cy,3,'#0A0D11',{delay:t+40,a:0.4}); }
          num(r, '-'+n, 'dmg big'+(n>=5?' huge':''), t);
          if(el) hitCard(el, t);
          shake(Math.min(14,(mine?4:3)+n*1.1), mine?420:300, t);
          if(mine && n>=3) vignette(t);
          later(t, 'face', n, panOf(r));
        } else { if(r){ add({k:'glow',x:r.cx,y:r.cy,r0:8,r1:60,col:'#7BE39A',hot:'#F2FFD8',life:600,delay:t}); motes(r.cx,r.cy+6,14,'#7BE39A','#FFF7C0',{delay:t,w:26}); add({k:'ring',x:r.cx,y:r.cy,r0:6,r1:46,w:4,col:'#9BEFB0',life:520,delay:t}); }
          num(r, '+'+e.n, 'heal', t); later(t,'heal',null,panOf(r)); }
        mark(t+800);
        break;
      }
      case 'mirror': { const el=cur(e.uid); const r=rectOf(el); if(r){ add({k:'glow',x:r.cx,y:r.cy,r0:8,r1:90,col:'#E8D8FF',hot:'#FFFFFF',life:600,delay:t}); add({k:'ring',x:r.cx,y:r.cy,r0:10,r1:80,w:5,col:'#C8B4FF',hot:'#FFFFFF',life:560,delay:t}); motes(r.cx,r.cy,14,'#FFF1A8','#FFFFFF',{delay:t,w:r.w*0.5}); motes(r.cx,r.cy,10,'#9B8CCB','#E0D0FF',{delay:t+80,w:r.w*0.5}); } later(t,'mirror',null,panOf(r)); mark(t+800); break; }
      case 'trap': later(0,'trap'); break;
      case 'bossphase': later(0,'boss'); shake(10,900,0); vignette(0,'rgba(140,60,255,.6)'); break;
      case 'turn': {
        if(game.winner==null){ const mine=e.p===me; later(t+80,'turn',mine); setTimeout(()=>banner(mine?'あなたのターン':'相手のターン', mine), t); mark(t+700); }
        break;
      }
    }
  });
  // 効果で場に出たクリーチャー（トークン・蘇生など）
  root.querySelectorAll('[data-zone="field"]').forEach(el=>{ const u=el.dataset.uid; if(!prev.cards[u] && !seenNew[u]){ const r=rectOf(el); const a=el.dataset.attr||'none';
    anim(el,[{transform:'scale(.4)',opacity:0,filter:'brightness(2.5)'},{transform:'scale(1.1)',opacity:1,offset:0.6},{transform:'scale(1)',filter:'brightness(1)'}],{duration:320,delay:t,easing:'ease-out',fill:'backwards'});
    if(r){ add({k:'glow',x:r.cx,y:r.cy,r0:6,r1:60,col:ATTR_COL(a),hot:ATTR_HOT[a],life:450,delay:t}); motes(r.cx,r.y+r.h-8,6,ATTR_COL(a),ATTR_HOT[a],{delay:t,w:r.w*0.4}); } } });
  busyUntil=Math.max(busyUntil, performance.now()+end);
}
